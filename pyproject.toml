[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "diffpfa"
version = "0.1.0"
description = "PyTorch Polar Format Algorithm (PFA) CPHD Image Processor"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "numpy",
    "scipy",
    "lxml",
    "sarkit"
]

[project.optional-dependencies]
viz = ["matplotlib", "pillow"]
dev = ["pytest", "matplotlib", "pillow"]

[tool.setuptools.packages.find]
where = ["."]
include = ["diffpfa*"]
exclude = ["tests*", "simulation*", "tools*", "PI*"]
